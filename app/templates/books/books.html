<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('main.books') }}"
        >
            📚 Library Manager
        </a>

        <div class="d-flex align-items-center">

            <span class="text-white me-3">
                Olá, {{ current_user.name }}
            </span>

            <a
                href="{{ url_for('auth.logout') }}"
                class="btn btn-outline-light btn-sm"
            >
                Sair
            </a>

        </div>

    </div>
</nav>

<div class="container my-5">

    <div class="card shadow mb-5">
        <div class="card-header">
            <h3 class="mb-0">Cadastrar Livro</h3>
        </div>

        <div class="card-body">

            <form action="/books" method="POST">

                <div class="mb-3">
                    <label class="form-label">ISBN</label>

            <div class="input-group">
                <input
                type="text"
                id="isbn"
                name="isbn"
                class="form-control"
                required
            >

            <button
                class="btn btn-primary"
                type="button"
                onclick="buscarLivro()"
            >
            
            Buscar
        </button>
    </div>
</div>

                <div class="text-center mb-4">
                    <img
                        id="book-cover"
                        src=""
                        class="img-fluid rounded shadow"
                        style="display:none; max-height:250px;"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Autor</label>
                    <input
                        type="text"
                        id="author"
                        name="author"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoria</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        class="form-control"
                        required
                    >
                </div>

                <button class="btn btn-success w-100">
                    Cadastrar Livro
                </button>

            </form>

        </div>
    </div>

    <div class="card shadow">

        <div class="card-header">
            <h3 class="mb-0">Livros Cadastrados</h3>
        </div>

        <div class="card-body">

            {% if books %}

            <table class="table table-striped table-hover align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th width="180">Ações</th>
                    </tr>
                </thead>

                <tbody>

                {% for book in books %}

                    <tr>

                        <td>{{ book.title }}</td>

                        <td>{{ book.author }}</td>

                        <td>

                            <a
                                href="/books/edit/{{ book.id }}"
                                class="btn btn-outline-warning btn-sm"
                            >
                                Editar
                            </a>

                            <a
                                href="/books/delete/{{ book.id }}"
                                class="btn btn-outline-danger btn-sm"
                            >
                                Excluir
                            </a>

                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

            {% else %}

            <div class="alert alert-info">
                Nenhum livro cadastrado.
            </div>

            {% endif %}

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/books.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
