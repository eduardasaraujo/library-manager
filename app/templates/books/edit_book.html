<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Livro</title>
</head>
<body>

<h1>Editar Livro</h1>

<form method="POST">

    <label>Título:</label><br>
    <input type="text" name="title" value="{{ book.title }}" required><br><br>

    <label>Autor:</label><br>
    <input type="text" name="author" value="{{ book.author }}" required><br><br>

    <label>ISBN:</label><br>
    <input type="text" name="isbn" value="{{ book.isbn }}" required><br><br>

    <label>Categoria:</label><br>
    <input type="text" name="category" value="{{ book.category }}" required><br><br>

    <button type="submit">Salvar Alterações</button>

</form>

<br>

<a href="/books">Voltar</a>

</body>
</html>
