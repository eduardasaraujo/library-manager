<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('main.books') }}"
        >
            📚 Library Manager
        </a>

        <a
            href="{{ url_for('main.books') }}"
            class="btn btn-outline-light btn-sm"
        >
            Voltar
        </a>

    </div>

</nav>

<div class="container my-5">

    <div class="card shadow">

        <div class="card-header">
            <h3 class="mb-0">Editar Livro</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Título</label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ book.title }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Autor</label>

                    <input
                        type="text"
                        name="author"
                        class="form-control"
                        value="{{ book.author }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">ISBN</label>

                    <input
                        type="text"
                        name="isbn"
                        class="form-control"
                        value="{{ book.isbn }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Categoria</label>

                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        value="{{ book.category }}"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">Avaliação</label>

                    <select
                        name="rating"
                        class="form-select"
                    >

                        <option value="" {% if not book.rating %}selected{% endif %}>
                            Sem avaliação
                        </option>

                        <option value="1" {% if book.rating == 1 %}selected{% endif %}>
                            ⭐ 1 estrela
                        </option>

                        <option value="2" {% if book.rating == 2 %}selected{% endif %}>
                            ⭐⭐ 2 estrelas
                        </option>

                        <option value="3" {% if book.rating == 3 %}selected{% endif %}>
                            ⭐⭐⭐ 3 estrelas
                        </option>

                        <option value="4" {% if book.rating == 4 %}selected{% endif %}>
                            ⭐⭐⭐⭐ 4 estrelas
                        </option>

                        <option value="5" {% if book.rating == 5 %}selected{% endif %}>
                            ⭐⭐⭐⭐⭐ 5 estrelas
                        </option>

                    </select>

                </div>

                <div class="d-grid gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Salvar Alterações
                    </button>

                    <a
                        href="{{ url_for('main.books') }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
